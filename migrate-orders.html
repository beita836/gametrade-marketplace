<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单迁移 - GameTrade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .info-box {
      background: #e8f4f8;
      border-left: 4px solid #3498db;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
      color: #2c3e50;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 20px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }

    .status.success {
      background: #d5f4e6;
      color: #27ae60;
      border-left: 4px solid #27ae60;
      display: block;
    }

    .status.error {
      background: #fadbd8;
      color: #e74c3c;
      border-left: 4px solid #e74c3c;
      display: block;
    }

    .loading {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📦 订单迁移</h1>
    <p class="subtitle">将现有订单导入到您的账户</p>

    <div class="info-box">
      <strong>ℹ️ 说明:</strong> 点击"开始迁移"按钮，系统将自动把所有现有订单转移到您的账户中。
    </div>

    <button class="btn btn-primary" id="migrateBtn" onclick="startMigration()">🚀 开始迁移</button>
    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import {
      getCurrentUser,
      addOrderToUser
    } from './supabase-config.js';

    // Define existing orders
    const EXISTING_ORDERS = [
      { id: "GT202608170001", time: "2026-08-17 19:59", buyer: "买家名称", amount: 200, title: "订单商品", status: "交易完成" },
      { id: "GT202608170002", time: "2026-08-17 15:30", buyer: "GameMaster", amount: 350, title: "CS2 饰品", status: "交易完成" },
      { id: "GT202608170003", time: "2026-08-16 20:15", buyer: "Pro Player", amount: 500, title: "PUBG 陪玩", status: "交易完成" }
    ];

    window.startMigration = async function() {
      const currentUser = await getCurrentUser();
      const btn = document.getElementById('migrateBtn');
      const status = document.getElementById('status');

      if (!currentUser) {
        status.textContent = '❌ 请先登录您的账户';
        status.classList.add('error');
        status.style.display = 'block';
        btn.disabled = true;
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      let successCount = 0;
      for (const order of EXISTING_ORDERS) {
        const result = await addOrderToUser(currentUser.id, order);
        if (result.success) successCount++;
      }

      btn.classList.remove('loading');
      btn.disabled = false;

      status.textContent = `✅ 迁移成功！已导入 ${successCount} 条订单`;
      status.classList.remove('error');
      status.classList.add('success');
      status.style.display = 'block';
    };
  </script>
</body>
</html>
